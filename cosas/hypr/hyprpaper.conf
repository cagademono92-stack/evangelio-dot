# hyprpaper.conf
# Config base — el wallpaper "real" en caliente lo maneja
# scripts/wallpaper.sh por IPC (hyprctl hyprpaper ...), pero dejamos acá
# un default para el primer arranque, antes de que waypaper/wallpaper.sh
# corran por primera vez.

preload = ~/Pictures/wallpapers/default.png
wallpaper = ,~/Pictures/wallpapers/default.png

splash = false
ipc = on
