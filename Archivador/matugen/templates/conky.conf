${font JetBrainsMono Nerd Font:size=34:bold}${color1}${time %H:%M}${font}
${color4}${hr 1}
${font JetBrainsMono Nerd Font:size=10}${color2}${time %A, %d de %B}${font}
${voffset 10}
${color3}  ${color}󰈀 subida  ${alignr}${upspeed ${gw_iface}}
${color3}  ${color}󰈂 bajada  ${alignr}${downspeed ${gw_iface}}
${voffset 8}
${color1}  ${color}DISCO  ${alignr}${fs_used /} / ${fs_size /}
${fs_bar /}
${voffset 8}
${color2}  uptime ${alignr}${color}${uptime_short}
${color2}  kernel ${alignr}${color}${kernel}
${voffset 8}
]];
