[general]
framerate = 30
bars = 18
# Deja que cava ajuste la sensibilidad sola para que la barra no se quede
# plana con música suave ni sature con música fuerte.
autosens = 1
sensitivity = 100
# gravity bajo = las barras caen despacio, se ve más fluido que el default.
gravity = 2
# Ignora cambios de volumen del reproductor: mover el slider no debe hacer
# que toda la barra salte.
ignore_volume = 2

[input]
method = pipewire
# IMPORTANTE: 'auto' usa el source MONITOR del sink por defecto, que es lo
# único que hace que se vea la música.
#
# Antes esto ponía el nombre del sink (ej. alsa_output...analog-stereo) y la
# barra llegaba apenas a 1-2 de 7: un sink es un nodo de SALIDA, para capturar
# hay que leer su source .monitor. Con 'auto' cava resuelve solo el monitor del
# sink por defecto, así que además sobrevive a cambiar de altavoces/auriculares.
source = auto

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 7